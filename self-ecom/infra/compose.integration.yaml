# 作用：仅供明确独占的真实数据库测试；不连接常用卷，100连接屏障有界上限240。
services:
  db:
    image: postgres:16.6-bookworm
    command: ["postgres", "-c", "max_connections=240"]
    environment:
      POSTGRES_DB: m415_ci_dev
      POSTGRES_USER: integration
      POSTGRES_PASSWORD: ${INTEGRATION_POSTGRES_PASSWORD:?请提供独占测试凭据}
      TZ: UTC
    ports:
      - "127.0.0.1:${INTEGRATION_DB_PORT:-25432}:5432"
    volumes:
      - integration_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integration -d m415_ci_dev"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  integration_db:

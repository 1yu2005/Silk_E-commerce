# 文件作用：提供前端页面、缓存策略及 API 代理，并阻止直接访问私有上传目录。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # 为5MiB图片预留multipart开销；API仍单独限制文件字节数。
    client_max_body_size 6m;
    error_page 413 = @request_too_large;
    location @request_too_large {
        default_type application/json;
        add_header X-Request-Id $request_id always;
        return 413 '{"code":"FILE_TOO_LARGE","message":"请求体超过代理6MiB限制","requestId":"$request_id"}';
    }

    # 使用 Docker DNS，在 API 容器重建后重新连接。
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /api/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 45s;
    }

    # 上传文件属于私有内容，不将上传数据卷挂载到 Nginx。
    location /storage/ { return 404; }
    location /uploads/ { return 404; }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / { try_files $uri $uri/ /index.html; }
}

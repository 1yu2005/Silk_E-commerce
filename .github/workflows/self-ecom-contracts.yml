# 文件作用：检查自营电商源码、OpenAPI与生成客户端一致；不连接开发库，不执行整板块回归。
name: self-ecom contracts
on:
  pull_request:
    paths: ['self-ecom/**', '.github/workflows/self-ecom-contracts.yml']
  push:
    paths: ['self-ecom/**', '.github/workflows/self-ecom-contracts.yml']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: self-ecom
    env:
      DATABASE_URL: postgresql://contract:contract@127.0.0.1:1/contract
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: self-ecom/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm contracts:check
      - run: pnpm --filter @shop/api-client build
      - run: pnpm --filter @shop/api-client exec tsc -p tsconfig.contracts.json
      - run: pnpm --filter @shop/shared test
      - run: pnpm --filter @shop/api-client test
